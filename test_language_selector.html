<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Language Selector</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #0a0a0a;
            color: #fff;
        }

        .language-selector {
            position: relative;
            display: inline-block;
        }

        .lang-btn {
            padding: 10px 20px;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #fff;
            cursor: pointer;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .lang-dropdown {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            min-width: 160px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 8px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.3s;
            z-index: 1000;
        }

        .language-selector.active .lang-dropdown {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .lang-option {
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .lang-option:hover {
            background: #2a2a2a;
        }

        .lang-option.active {
            background: #2a2a2a;
            color: #00ff88;
        }

        .test-area {
            margin-top: 40px;
            padding: 20px;
            background: #1a1a1a;
            border-radius: 8px;
        }

        .log {
            background: #000;
            padding: 10px;
            margin-top: 10px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <h1>Test du Sélecteur de Langue</h1>

    <div class="language-selector">
        <button class="lang-btn" id="lang-btn">
            <span>🌍</span>
            <span class="lang-current">EN</span>
            <span>▼</span>
        </button>
        <div class="lang-dropdown" id="lang-dropdown">
            <button class="lang-option active" data-lang="en">
                <span>🇺🇸</span> English
            </button>
            <button class="lang-option" data-lang="es">
                <span>🇪🇸</span> Español
            </button>
            <button class="lang-option" data-lang="fr">
                <span>🇫🇷</span> Français
            </button>
            <button class="lang-option" data-lang="de">
                <span>🇩🇪</span> Deutsch
            </button>
        </div>
    </div>

    <div class="test-area">
        <h2>Console de Test</h2>
        <div id="console-output" class="log"></div>
    </div>

    <script>
        // Console personnalisée
        const consoleOutput = document.getElementById('console-output');
        function log(msg, type = 'info') {
            const line = document.createElement('div');
            line.style.color = type === 'error' ? '#ff5555' : type === 'success' ? '#00ff88' : '#aaa';
            line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            consoleOutput.appendChild(line);
            console.log(msg);
        }

        log('🚀 Script chargé', 'info');

        // Test de sélection des éléments
        const langBtn = document.getElementById('lang-btn');
        const langDropdown = document.getElementById('lang-dropdown');
        const langSelector = document.querySelector('.language-selector');

        log(`langBtn trouvé: ${!!langBtn}`, langBtn ? 'success' : 'error');
        log(`langDropdown trouvé: ${!!langDropdown}`, langDropdown ? 'success' : 'error');
        log(`langSelector trouvé: ${!!langSelector}`, langSelector ? 'success' : 'error');

        if (!langBtn || !langDropdown || !langSelector) {
            log('❌ Éléments manquants!', 'error');
        } else {
            log('✅ Tous les éléments sont présents', 'success');

            // Setup event listeners
            langBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                langSelector.classList.toggle('active');
                const isActive = langSelector.classList.contains('active');
                log(`📍 Bouton cliqué - Menu ${isActive ? 'OUVERT' : 'FERMÉ'}`, 'success');
            });

            document.addEventListener('click', () => {
                if (langSelector.classList.contains('active')) {
                    langSelector.classList.remove('active');
                    log('📍 Clic extérieur - Menu fermé', 'info');
                }
            });

            langDropdown.querySelectorAll('.lang-option').forEach(option => {
                option.addEventListener('click', () => {
                    const lang = option.getAttribute('data-lang');
                    log(`🌍 Langue sélectionnée: ${lang}`, 'success');

                    // Update display
                    document.querySelector('.lang-current').textContent = lang.toUpperCase();

                    // Update active state
                    langDropdown.querySelectorAll('.lang-option').forEach(opt => {
                        opt.classList.remove('active');
                    });
                    option.classList.add('active');

                    langSelector.classList.remove('active');
                });
            });

            log('✅ Event listeners configurés', 'success');
        }
    </script>
</body>
</html>
