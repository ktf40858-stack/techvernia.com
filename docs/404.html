    var m = location.pathname.match(/^\/(fr|es|de|pt|zh|ja|ko|ar|hi)(\/.*)?$/);

      var lang = m[1];
      var rest = m[2] && m[2] !== '/' ? m[2] : '/';
      var sep = location.search ? '&' : '?';
      location.replace(rest + location.search + sep + 'lang=' + lang + location.hash);
    }
  })();
</script>
