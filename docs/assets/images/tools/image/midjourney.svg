<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Midjourney Logo - White on Dark Theme -->
  <rect width="200" height="200" rx="20" fill="#000000"/>

  <!-- Midjourney Sailboat Icon -->
  <g transform="translate(100, 100)">
    <!-- Main sail - left -->
    <path d="M -35 -25 L -35 35 L -5 10 Z" fill="#FFFFFF" opacity="0.9"/>

    <!-- Main sail - right -->
    <path d="M 5 -25 L 5 35 L 35 10 Z" fill="#FFFFFF" opacity="0.9"/>

    <!-- Center mast -->
    <rect x="-2" y="-35" width="4" height="75" fill="#FFFFFF"/>

    <!-- Accent lines -->
    <line x1="-35" y1="35" x2="35" y2="35" stroke="#FFFFFF" stroke-width="2" opacity="0.7"/>

    <!-- Decorative dots -->
    <circle cx="-25" cy="-15" r="2" fill="#FFFFFF" opacity="0.6"/>
    <circle cx="25" cy="-15" r="2" fill="#FFFFFF" opacity="0.6"/>
    <circle cx="0" cy="-35" r="3" fill="#FFFFFF"/>
  </g>

  <!-- Brand Text -->
  <text x="100" y="165" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">MIDJOURNEY</text>
</svg>
