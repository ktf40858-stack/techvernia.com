<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="atlasGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="100" cy="100" r="90" fill="url(#atlasGrad)" opacity="0.1"/>

  <!-- Globe/World Icon -->
  <circle cx="100" cy="100" r="45" fill="none" stroke="url(#atlasGrad)" stroke-width="6"/>
  <ellipse cx="100" cy="100" rx="45" ry="20" fill="none" stroke="url(#atlasGrad)" stroke-width="4"/>
  <ellipse cx="100" cy="100" rx="20" ry="45" fill="none" stroke="url(#atlasGrad)" stroke-width="4"/>
  <line x1="55" y1="100" x2="145" y2="100" stroke="url(#atlasGrad)" stroke-width="4"/>

  <!-- Text -->
  <text x="100" y="170" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="url(#atlasGrad)" text-anchor="middle">Atlas.new</text>
</svg>
