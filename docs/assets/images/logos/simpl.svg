  <circle cx="130" cy="120" r="5" fill="url(#simplGrad)"/>

  <!-- Text -->
  <text x="100" y="170" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="url(#simplGrad)" text-anchor="middle">Simpl</text>
