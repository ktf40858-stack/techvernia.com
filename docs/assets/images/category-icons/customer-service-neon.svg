<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="grad-customer" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
        </linearGradient>
        <filter id="glow-customer">
            <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    <!-- Speech Bubble -->
    <path d="M 25 35 L 95 35 L 95 70 L 70 70 L 60 85 L 60 70 L 25 70 Z" stroke="url(#grad-customer)" stroke-width="3" fill="none" filter="url(#glow-customer)" rx="5"/>
    <!-- Chat Lines -->
    <line x1="35" y1="45" x2="75" y2="45" stroke="url(#grad-customer)" stroke-width="2" filter="url(#glow-customer)"/>
    <line x1="35" y1="55" x2="85" y2="55" stroke="url(#grad-customer)" stroke-width="2" filter="url(#glow-customer)"/>
    <line x1="35" y1="65" x2="65" y2="65" stroke="url(#grad-customer)" stroke-width="2" filter="url(#glow-customer)"/>
</svg>
