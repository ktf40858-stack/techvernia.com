<!DOCTYPE html>
<html>
<head>
    <title>Test i18n-ai-history.js</title>
</head>
<body>
    <h1>Test de syntaxe JavaScript</h1>
    <div id="result"></div>

    <script>
        console.log('🧪 Starting syntax test...');
        try {
            // Try to load the script
            const script = document.createElement('script');
            script.src = './techvernia.com/js/i18n-ai-history.js?v=' + Date.now();
            script.onload = () => {
                console.log('✅ Script loaded successfully!');
                console.log('📦 aiHistoryTranslations exists:', typeof aiHistoryTranslations !== 'undefined');
                console.log('🔧 Available languages:', Object.keys(aiHistoryTranslations || {}));
                document.getElementById('result').innerHTML = '<p style="color: green;">✅ Script chargé avec succès!</p>';
            };
            script.onerror = (e) => {
                console.error('❌ Script failed to load:', e);
                document.getElementById('result').innerHTML = '<p style="color: red;">❌ Erreur de chargement du script!</p>';
            };
            document.head.appendChild(script);
        } catch (e) {
            console.error('❌ Error:', e);
            document.getElementById('result').innerHTML = '<p style="color: red;">❌ Erreur: ' + e.message + '</p>';
        }
    </script>
</body>
</html>
