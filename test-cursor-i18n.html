<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Test Cursor i18n</title>
</head>
<body>
    <h1>Test des traductions Cursor</h1>

    <h2><span data-i18n="review.cursor.overview">Overview</span></h2>
    <p><span data-i18n="review.cursor.cursor.is.revolutionizing.how.developers">Cursor is revolutionizing...</span></p>

    <script src="GenuisNet.ai/js/cursor-i18n.js"></script>
    <script>
        console.log('=== TEST CURSOR I18N ===');
        console.log('cursorTranslations object exists:', typeof cursorTranslations !== 'undefined');

        if (typeof cursorTranslations !== 'undefined') {
            console.log('DE section exists:', typeof cursorTranslations.de !== 'undefined');

            const testKey = 'review.cursor.cursor.is.revolutionizing.how.developers';
            console.log('Test key in EN:', cursorTranslations.en[testKey]);
            console.log('Test key in DE:', cursorTranslations.de[testKey]);

            // Apply translation manually
            const translation = getCursorTranslation(testKey, 'de');
            console.log('Translation via function:', translation);

            // Apply to all elements
            applyCursorTranslations('de');
        } else {
            console.error('ERROR: cursorTranslations not loaded!');
        }
    </script>
</body>
</html>
