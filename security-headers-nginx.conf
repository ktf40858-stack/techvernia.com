# ==============================================
# TechVernia Security Headers Configuration
# Nginx
# ==============================================
#
# Usage: Include this file in your nginx server block:
# include /path/to/security-headers-nginx.conf;

# Content Security Policy (Improved - 'unsafe-inline' removed for scripts)
# Prevents XSS attacks by controlling which resources can be loaded
# NOTE: style-src still uses 'unsafe-inline' for SVG gradients and inline styles
# To fully remove 'unsafe-inline' from styles, move all inline styles to external CSS files
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; font-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;" always;

# X-Frame-Options
# Prevents clickjacking attacks
add_header X-Frame-Options "SAMEORIGIN" always;

# X-Content-Type-Options
# Prevents MIME type sniffing
add_header X-Content-Type-Options "nosniff" always;

# Strict-Transport-Security (HSTS)
# Forces HTTPS connections (only enable if you have SSL/TLS)
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# X-XSS-Protection
# Enables browser XSS protection (legacy browsers)
add_header X-XSS-Protection "1; mode=block" always;

# Referrer-Policy
# Controls how much referrer information is shared
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Permissions-Policy
# Controls which browser features can be used
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), accelerometer=(), gyroscope=(), magnetometer=()" always;

# Disable server tokens (hides Nginx version)
server_tokens off;

# Prevent access to hidden files
location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
}

# Prevent access to sensitive files
location ~* \.(env|config|ini|log|sh|sql|bak|backup|old|tmp|swp|save)$ {
    deny all;
    access_log off;
    log_not_found off;
}

# Block test and debug files
location ~* ^/(test-|TEST_|diagnostic-).*\.(html|js)$ {
    deny all;
    access_log off;
    log_not_found off;
}

# Block JSON batch data files
location ~* batch.*\.json$ {
    deny all;
    access_log off;
    log_not_found off;
}
