<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagnostic Traduction</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { padding: 40px; background: #1a1a1a; color: #fff; }
        .box {
            background: #2a2a2a;
            border: 2px solid #444;
            padding: 30px;
            margin: 20px 0;
            border-radius: 12px;
        }
        .test-text {
            font-size: 24px;
            margin: 15px 0;
            padding: 15px;
            background: #333;
            border-radius: 8px;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            margin: 10px;
            cursor: pointer;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
        }
        .log {
            background: #000;
            color: #0f0;
            padding: 20px;
            font-family: monospace;
            font-size: 14px;
            max-height: 400px;
            overflow-y: auto;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <h1><svg class="neon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg> Diagnostic de Traduction</h1>

    <div class="box">
        <h2>Contrôles Manuels</h2>
        <button onclick="testTranslate()">🇫🇷 Forcer Traduction Française</button>
        <button onclick="testTranslateES()">🇪🇸 Forcer Traduction Espagnole</button>
        <button onclick="checkStatus()"><svg class="neon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg> Vérifier Statut</button>
        <button onclick="clearLogs()">🗑️ Effacer Logs</button>
    </div>

    <div class="box">
        <h2>Textes de Test (SANS data-i18n)</h2>
        <div class="test-text" id="test1">Try Free</div>
        <div class="test-text" id="test2">Try for free</div>
        <div class="test-text" id="test3">Features</div>
        <div class="test-text" id="test4">United States</div>
        <div class="test-text" id="test5">ChatGPT - Try for free</div>
    </div>

    <div class="box">
        <h2>Textes avec data-i18n (devraient changer avec i18n.js)</h2>
        <div class="test-text" data-i18n="nav.home">Home</div>
        <div class="test-text" data-i18n="stats.avgRating">Avg Rating</div>
    </div>

    <div class="box">
        <h2><svg class="neon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg> Console de Diagnostic</h2>
        <div id="logs" class="log">En attente...</div>
    </div>

    <script>
        const logsDiv = document.getElementById('logs');

        function log(msg, color = '#0f0') {
            const time = new Date().toLocaleTimeString();
            logsDiv.innerHTML += `<div style="color: ${color}">[${time}] ${msg}</div>`;
            logsDiv.scrollTop = logsDiv.scrollHeight;
            console.log(msg);
        }

        function clearLogs() {
            logsDiv.innerHTML = '';
            log('Logs effacés');
        }

        function testTranslate() {
            log('🇫🇷 Test de traduction forcée vers FR...', '#ffff00');

            if (window.universalTranslate && window.universalTranslate.translate) {
                window.universalTranslate.translate('fr');
                log('<svg class="neon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg> Fonction universalTranslate appelée', '#0f0');

                setTimeout(() => {
                    log(`Contenu test1: "${document.getElementById('test1').textContent}"`, '#00ffff');
                    log(`Contenu test2: "${document.getElementById('test2').textContent}"`, '#00ffff');
                    log(`Contenu test3: "${document.getElementById('test3').textContent}"`, '#00ffff');
                }, 500);
            } else {
                log('<svg class="neon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg> universalTranslate non disponible!', '#ff0000');
            }
        }

        function testTranslateES() {
            log('🇪🇸 Test de traduction forcée vers ES...', '#ffff00');

            if (window.universalTranslate) {
                window.universalTranslate.translate('es');
                log('<svg class="neon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg> Fonction universalTranslate appelée', '#0f0');
            } else {
                log('<svg class="neon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg> universalTranslate non disponible!', '#ff0000');
            }
        }

        function checkStatus() {
            log('<svg class="neon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg> Vérification du statut...', '#ffff00');
            log(`i18n disponible: ${window.i18n !== undefined}`, window.i18n ? '#0f0' : '#ff0000');
            log(`universalTranslate disponible: ${window.universalTranslate !== undefined}`, window.universalTranslate ? '#0f0' : '#ff0000');
            log(`autoTranslate disponible: ${window.autoTranslate !== undefined}`, window.autoTranslate ? '#0f0' : '#ff0000');

            if (window.i18n && window.i18n.getCurrentLanguage) {
                log(`Langue actuelle: ${window.i18n.getCurrentLanguage()}`, '#00ffff');
            }
        }

        log('<svg class="neon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11a3 3 0 1 0 6 0a9 9 0 0 1 0-9a9 9 0 0 1 0 9"/><path d="M6 15.8a9 9 0 0 0 3 .2c2 0 4-.5 6-1.5"/><path d="M9 19c.8-2.8 1.2-5.4 1.2-8"/></svg> Page de diagnostic chargée');
    </script>

    <!-- Charger les scripts dans l'ordre -->
    <script src="js/i18n.js"></script>
    <script>log('<svg class="neon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="16.5" y1="9.4" x2="7.5" y2="4.21"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg> i18n.js chargé', '#0f0');</script>

    <script src="js/auto-translate.js"></script>
    <script>
        log('<svg class="neon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="16.5" y1="9.4" x2="7.5" y2="4.21"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg> auto-translate.js chargé', '#0f0');

        setTimeout(() => {
            checkStatus();
        }, 500);

        // Écouter l'événement languageChanged
        window.addEventListener('languageChanged', (e) => {
            log(`📡 Événement languageChanged: ${e.detail.language}`, '#ffff00');
        });
    </script>
</body>
</html>
