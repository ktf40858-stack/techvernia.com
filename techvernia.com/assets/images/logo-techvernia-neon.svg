<svg width="2400" height="720" viewBox="0 0 2400 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient néon principal pour "Tech" -->
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D9FF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E879F9;stop-opacity:1" />
    </linearGradient>

    <!-- Gradient pour "Vernia" - même que "of AI Tools" -->
    <linearGradient id="verniaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A855F7;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00D9FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F472B6;stop-opacity:1" />
    </linearGradient>

    <!-- Filtre glow néon ULTRA HD - ultra net avec glow premium -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur2"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur3"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur4"/>
      <feMerge>
        <feMergeNode in="blur4"/>
        <feMergeNode in="blur3"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Filtre pour l'effet de pulse -->
    <filter id="pulse">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4"/>
    </filter>

    <!-- Filtre pour effet de brillance -->
    <filter id="shine">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.5"/>
      <feColorMatrix type="saturate" values="1.5"/>
    </filter>
  </defs>

  <!-- Cercle de fond avec glow - ULTRA HD -->
  <circle cx="360" cy="360" r="240" fill="none" stroke="url(#neonGradient)" stroke-width="12" opacity="0.3" filter="url(#neonGlow)">
    <animate attributeName="r" values="240;264;240" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.5;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Icône AI avec design neural network - ULTRA HD -->
  <g filter="url(#neonGlow)">
    <!-- Nœud central avec brillance -->
    <circle cx="360" cy="360" r="48" fill="url(#neonGradient)" filter="url(#shine)">
      <animate attributeName="r" values="48;60;48" dur="2s" repeatCount="indefinite"/>
    </circle>

    <!-- Halo interne -->
    <circle cx="360" cy="360" r="32" fill="#00D9FF" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>

    <!-- Nœuds périphériques avec détails -->
    <circle cx="240" cy="240" r="24" fill="#00D9FF" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="480" cy="240" r="24" fill="#7C3AED" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="240" cy="480" r="24" fill="#E879F9" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="480" cy="480" r="24" fill="#00D9FF" stroke="#FFFFFF" stroke-width="2"/>

    <!-- Nœuds secondaires pour plus de détails -->
    <circle cx="300" cy="300" r="12" fill="#00D9FF" opacity="0.6"/>
    <circle cx="420" cy="300" r="12" fill="#7C3AED" opacity="0.6"/>
    <circle cx="300" cy="420" r="12" fill="#E879F9" opacity="0.6"/>
    <circle cx="420" cy="420" r="12" fill="#00D9FF" opacity="0.6"/>

    <!-- Connexions principales (lignes de réseau neuronal) -->
    <line x1="360" y1="360" x2="240" y2="240" stroke="url(#neonGradient)" stroke-width="8" opacity="0.8" stroke-linecap="round"/>
    <line x1="360" y1="360" x2="480" y2="240" stroke="url(#neonGradient)" stroke-width="8" opacity="0.8" stroke-linecap="round"/>
    <line x1="360" y1="360" x2="240" y2="480" stroke="url(#neonGradient)" stroke-width="8" opacity="0.8" stroke-linecap="round"/>
    <line x1="360" y1="360" x2="480" y2="480" stroke="url(#neonGradient)" stroke-width="8" opacity="0.8" stroke-linecap="round"/>

    <!-- Connexions secondaires -->
    <line x1="360" y1="360" x2="300" y2="300" stroke="url(#neonGradient)" stroke-width="4" opacity="0.4" stroke-linecap="round"/>
    <line x1="360" y1="360" x2="420" y2="300" stroke="url(#neonGradient)" stroke-width="4" opacity="0.4" stroke-linecap="round"/>
    <line x1="360" y1="360" x2="300" y2="420" stroke="url(#neonGradient)" stroke-width="4" opacity="0.4" stroke-linecap="round"/>
    <line x1="360" y1="360" x2="420" y2="420" stroke="url(#neonGradient)" stroke-width="4" opacity="0.4" stroke-linecap="round"/>
  </g>

  <!-- Texte TechVernia avec effet néon - ULTRA HD sur une seule ligne -->
  <text x="780" y="380" font-family="'Space Grotesk', sans-serif" font-size="216" font-weight="800" fill="url(#neonGradient)" filter="url(#neonGlow)" letter-spacing="4">
    Tech
  </text>
  <text x="1320" y="380" font-family="'Space Grotesk', sans-serif" font-size="216" font-weight="800" fill="url(#verniaGradient)" filter="url(#neonGlow)" letter-spacing="4">
    Vernia
  </text>

</svg>
