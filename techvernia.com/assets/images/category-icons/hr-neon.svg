<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="grad-hr" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#EC4899;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#DB2777;stop-opacity:1" />
        </linearGradient>
        <filter id="glow-hr">
            <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    <!-- People Icons -->
    <circle cx="45" cy="40" r="8" stroke="url(#grad-hr)" stroke-width="2.5" fill="none" filter="url(#glow-hr)"/>
    <path d="M 30 65 Q 30 52 45 52 Q 60 52 60 65" stroke="url(#grad-hr)" stroke-width="2.5" fill="none" filter="url(#glow-hr)"/>
    <circle cx="75" cy="40" r="8" stroke="url(#grad-hr)" stroke-width="2.5" fill="none" filter="url(#glow-hr)"/>
    <path d="M 60 65 Q 60 52 75 52 Q 90 52 90 65" stroke="url(#grad-hr)" stroke-width="2.5" fill="none" filter="url(#glow-hr)"/>
    <!-- Connection Line -->
    <line x1="45" y1="75" x2="75" y2="75" stroke="url(#grad-hr)" stroke-width="2" filter="url(#glow-hr)" stroke-dasharray="3,3"/>
</svg>
