<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="grad-quantum" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#4F46E5;stop-opacity:1" />
        </linearGradient>
        <filter id="glow-quantum">
            <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    <!-- Atom Structure -->
    <circle cx="60" cy="60" r="6" fill="url(#grad-quantum)" filter="url(#glow-quantum)"/>
    <!-- Electron Orbits -->
    <ellipse cx="60" cy="60" rx="35" ry="15" stroke="url(#grad-quantum)" stroke-width="2.5" fill="none" filter="url(#glow-quantum)"/>
    <ellipse cx="60" cy="60" rx="35" ry="15" stroke="url(#grad-quantum)" stroke-width="2.5" fill="none" filter="url(#glow-quantum)" transform="rotate(60 60 60)"/>
    <ellipse cx="60" cy="60" rx="35" ry="15" stroke="url(#grad-quantum)" stroke-width="2.5" fill="none" filter="url(#glow-quantum)" transform="rotate(120 60 60)"/>
    <!-- Electrons -->
    <circle cx="95" cy="60" r="4" fill="url(#grad-quantum)" filter="url(#glow-quantum)"/>
    <circle cx="42" cy="42" r="4" fill="url(#grad-quantum)" filter="url(#glow-quantum)"/>
    <circle cx="42" cy="78" r="4" fill="url(#grad-quantum)" filter="url(#glow-quantum)"/>
</svg>
