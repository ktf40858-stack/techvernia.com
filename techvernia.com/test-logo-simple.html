<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logo Simple Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0A0A0F;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .logo-display {
            text-align: center;
        }

        .logo-display img {
            height: 80px;
            width: auto;
            filter: drop-shadow(0 0 20px rgba(0, 217, 255, 0.4));
            transition: all 0.3s ease;
        }

        .logo-display img:hover {
            filter: drop-shadow(0 0 30px rgba(0, 217, 255, 0.6));
            transform: scale(1.05);
        }

        .info {
            color: rgba(255, 255, 255, 0.5);
            margin-top: 2rem;
            font-family: 'Inter', sans-serif;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>
    <div class="logo-display">
        <img src="assets/images/logo.png" alt="TechVernia">
        <div class="info">
            Symbole néon + texte sur fond noir du site<br>
            (Survolez pour voir l'effet glow)
        </div>
    </div>
</body>
</html>
