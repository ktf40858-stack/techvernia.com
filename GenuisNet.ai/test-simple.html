<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Test Simple</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
            background: #1a1a1a;
            color: #fff;
        }
        button {
            padding: 10px 20px;
            margin: 10px;
            font-size: 16px;
            cursor: pointer;
        }
        .result {
            margin-top: 20px;
            padding: 20px;
            background: #2a2a2a;
            border-radius: 8px;
        }
        .log {
            background: #000;
            color: #0f0;
            padding: 10px;
            margin: 10px 0;
            font-family: monospace;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <h1>🧪 Test Simple de Traduction</h1>

    <div>
        <button onclick="testI18n()">Test i18n.js</button>
        <button onclick="testAutoTranslate()">Test auto-translate.js</button>
        <button onclick="changeToFrench()">Changer en Français</button>
    </div>

    <div class="result">
        <h2>Texte avec data-i18n:</h2>
        <p data-i18n="nav.home">Home</p>
        <p data-i18n="stats.avgRating">Avg Rating</p>

        <h2>Texte SANS data-i18n:</h2>
        <p id="test1">Features</p>
        <p id="test2">Pricing</p>
    </div>

    <div id="logs" class="log">Logs apparaîtront ici...</div>

    <script>
        function log(msg) {
            const logsDiv = document.getElementById('logs');
            logsDiv.innerHTML += '<br>' + new Date().toLocaleTimeString() + ' - ' + msg;
        }

        function testI18n() {
            log('Testing i18n...');
            log('window.i18n exists: ' + (window.i18n !== undefined));
            if (window.i18n) {
                log('Current language: ' + window.i18n.getCurrentLanguage());
                log('Available languages: ' + window.i18n.getAvailableLanguages().join(', '));
            }
        }

        function testAutoTranslate() {
            log('Testing auto-translate...');
            log('window.autoTranslate exists: ' + (window.autoTranslate !== undefined));
        }

        function changeToFrench() {
            log('Changing language to French...');
            if (window.i18n) {
                window.i18n.setLanguage('fr');
                log('Language changed!');
            } else {
                log('ERROR: i18n not loaded!');
            }
        }

        log('Page loaded');
    </script>

    <script src="js/i18n.js"></script>
    <script>
        log('i18n.js loaded');
        setTimeout(() => {
            if (window.i18n) {
                log('<svg class="neon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg> i18n available');
                log('Current lang: ' + window.i18n.getCurrentLanguage());
            } else {
                log('<svg class="neon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg> i18n NOT available');
            }
        }, 100);
    </script>

    <script src="js/auto-translate.js"></script>
    <script>
        log('auto-translate.js loaded');
        setTimeout(() => {
            if (window.autoTranslate) {
                log('<svg class="neon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg> autoTranslate available');
            } else {
                log('<svg class="neon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg> autoTranslate NOT available');
            }
        }, 100);
    </script>
</body>
</html>
