                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    <!-- Code brackets <> -->
    <path d="M 45 35 L 25 60 L 45 85" stroke="url(#grad-coding)" stroke-width="3" stroke-linecap="round" fill="none" filter="url(#glow-coding)"/>
