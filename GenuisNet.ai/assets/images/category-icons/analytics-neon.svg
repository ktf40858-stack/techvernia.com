<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="grad-analytics" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#2563EB;stop-opacity:1" />
        </linearGradient>
        <filter id="glow-analytics">
            <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    <!-- Bar Chart -->
    <rect x="25" y="50" width="12" height="40" rx="2" stroke="url(#grad-analytics)" stroke-width="3" fill="none" filter="url(#glow-analytics)"/>
    <rect x="42" y="35" width="12" height="55" rx="2" stroke="url(#grad-analytics)" stroke-width="3" fill="none" filter="url(#glow-analytics)"/>
    <rect x="59" y="25" width="12" height="65" rx="2" stroke="url(#grad-analytics)" stroke-width="3" fill="none" filter="url(#glow-analytics)"/>
    <rect x="76" y="40" width="12" height="50" rx="2" stroke="url(#grad-analytics)" stroke-width="3" fill="none" filter="url(#glow-analytics)"/>
    <!-- Trend Line -->
    <path d="M 20 75 L 40 60 L 60 45 L 80 55 L 100 30" stroke="url(#grad-analytics)" stroke-width="2" fill="none" filter="url(#glow-analytics)" stroke-dasharray="3,3"/>
</svg>
