<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="grad-legal" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#D97706;stop-opacity:1" />
        </linearGradient>
        <filter id="glow-legal">
            <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    <!-- Scale Base -->
    <line x1="60" y1="30" x2="60" y2="80" stroke="url(#grad-legal)" stroke-width="3" filter="url(#glow-legal)"/>
    <!-- Left Pan -->
    <path d="M 30 50 L 45 55 L 45 50 L 30 45 Z" stroke="url(#grad-legal)" stroke-width="2" fill="none" filter="url(#glow-legal)"/>
    <line x1="37.5" y1="47.5" x2="37.5" y2="30" stroke="url(#grad-legal)" stroke-width="2" filter="url(#glow-legal)"/>
    <!-- Right Pan -->
    <path d="M 90 50 L 75 55 L 75 50 L 90 45 Z" stroke="url(#grad-legal)" stroke-width="2" fill="none" filter="url(#glow-legal)"/>
    <line x1="82.5" y1="47.5" x2="82.5" y2="30" stroke="url(#grad-legal)" stroke-width="2" filter="url(#glow-legal)"/>
    <!-- Crossbar -->
    <line x1="37.5" y1="30" x2="82.5" y2="30" stroke="url(#grad-legal)" stroke-width="3" filter="url(#glow-legal)"/>
    <!-- Base -->
    <line x1="45" y1="80" x2="75" y2="80" stroke="url(#grad-legal)" stroke-width="4" filter="url(#glow-legal)"/>
</svg>
