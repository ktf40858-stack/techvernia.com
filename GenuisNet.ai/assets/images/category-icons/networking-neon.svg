<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad-networking" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2DD4BF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#14B8A6;stop-opacity:1" />
    </linearGradient>
    <filter id="glow-networking">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Network nodes (circles) -->
  <circle cx="60" cy="30" r="8" stroke="url(#grad-networking)" stroke-width="3" fill="none" filter="url(#glow-networking)"/>
  <circle cx="30" cy="60" r="8" stroke="url(#grad-networking)" stroke-width="3" fill="none" filter="url(#glow-networking)"/>
  <circle cx="90" cy="60" r="8" stroke="url(#grad-networking)" stroke-width="3" fill="none" filter="url(#glow-networking)"/>
  <circle cx="60" cy="90" r="8" stroke="url(#grad-networking)" stroke-width="3" fill="none" filter="url(#glow-networking)"/>

  <!-- Center hub (larger circle) -->
  <circle cx="60" cy="60" r="12" stroke="url(#grad-networking)" stroke-width="3" fill="none" filter="url(#glow-networking)"/>

  <!-- Connection lines -->
  <line x1="60" y1="38" x2="60" y2="48" stroke="url(#grad-networking)" stroke-width="2.5" filter="url(#glow-networking)"/>
  <line x1="38" y1="60" x2="48" y2="60" stroke="url(#grad-networking)" stroke-width="2.5" filter="url(#glow-networking)"/>
  <line x1="82" y1="60" x2="72" y2="60" stroke="url(#grad-networking)" stroke-width="2.5" filter="url(#glow-networking)"/>
  <line x1="60" y1="82" x2="60" y2="72" stroke="url(#grad-networking)" stroke-width="2.5" filter="url(#glow-networking)"/>

  <!-- Diagonal connections -->
  <line x1="45" y1="45" x2="52" y2="52" stroke="url(#grad-networking)" stroke-width="2" filter="url(#glow-networking)" opacity="0.6"/>
  <line x1="75" y1="45" x2="68" y2="52" stroke="url(#grad-networking)" stroke-width="2" filter="url(#glow-networking)" opacity="0.6"/>
  <line x1="45" y1="75" x2="52" y2="68" stroke="url(#grad-networking)" stroke-width="2" filter="url(#glow-networking)" opacity="0.6"/>
  <line x1="75" y1="75" x2="68" y2="68" stroke="url(#grad-networking)" stroke-width="2" filter="url(#glow-networking)" opacity="0.6"/>
</svg>
