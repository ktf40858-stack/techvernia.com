<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- ElevenLabs Logo - Orange/Black Theme -->
  <rect width="200" height="200" rx="20" fill="#000000"/>

  <!-- Number "11" Design -->
  <g transform="translate(50, 50)">
    <!-- First "1" -->
    <rect x="10" y="20" width="15" height="80" rx="3" fill="#FF6B35"/>
    <rect x="10" y="15" width="15" height="10" rx="2" fill="#FF6B35"/>

    <!-- Second "1" -->
    <rect x="45" y="20" width="15" height="80" rx="3" fill="#FF6B35"/>
    <rect x="45" y="15" width="15" height="10" rx="2" fill="#FF6B35"/>

    <!-- Accent dots -->
    <circle cx="35" cy="55" r="3" fill="#FF6B35" opacity="0.6"/>
    <circle cx="35" cy="75" r="3" fill="#FF6B35" opacity="0.6"/>
    <circle cx="70" cy="55" r="3" fill="#FF6B35" opacity="0.4"/>
  </g>

  <!-- Brand Text -->
  <text x="100" y="150" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="middle">ElevenLabs</text>
</svg>
